<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111418">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="About My OC 的本機內容編輯器">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>OC 網站編輯器</title>
  <script>
    (() => {
      try { localStorage.setItem("about-my-oc-owner-mode", "1"); } catch { /* 無法使用儲存空間時忽略 */ }
      const isLocalFile = window.location.protocol === "file:";
      const refreshVersion = new URLSearchParams(window.location.search).get("refresh");
      const assetVersion = refreshVersion || "20260824-editor-v6";
      const suffix = isLocalFile ? "" : `?v=${encodeURIComponent(assetVersion)}`;
      document.write(`<link rel="stylesheet" href="style.css${suffix}">`);
      document.write(`<link rel="stylesheet" href="editor.css${suffix}">`);
      document.write(`<link rel="stylesheet" href="image-upload.css${suffix}">`);
      document.write(`<script defer src="data.js${suffix}"><\/script>`);
      document.write(`<script defer src="editor.js${suffix}"><\/script>`);
      document.write(`<script defer src="image-upload.js${suffix}"><\/script>`);
    })();
  </script>
</head>
<body class="editor-body" data-theme="archive">
  <header class="editor-topbar">
    <a class="editor-back" href="index.html#/">← 公開網站</a>
    <div class="editor-title-group">
      <strong>OC 網站編輯器</strong>
      <span>本機草稿，不會直接改動公開網站</span>
    </div>
    <div class="editor-top-actions">
      <button class="editor-button ghost" id="save-draft-button" type="button">儲存草稿</button>
      <button class="editor-button ghost" id="import-button" type="button">匯入資料</button>
      <button class="editor-button" id="download-button" type="button">下載 data.js</button>
      <button class="editor-button primary" id="publish-button" type="button">複製並打開 GitHub</button>
    </div>
  </header>

  <main class="editor-layout">
    <aside class="editor-sidebar" aria-label="內容導覽">
      <button class="tree-item root-item is-active" type="button" data-select-type="site">
        <span>網站設定</span>
        <small>名稱與首頁文字</small>
      </button>

      <div class="sidebar-heading">
        <span>世界與角色</span>
        <button id="add-world-button" type="button" aria-label="新增世界">＋</button>
      </div>

      <div id="world-tree" class="world-tree"></div>

      <div class="sidebar-empty" id="world-tree-empty">
        尚未建立世界。按上方的「＋」開始。
      </div>

      <section class="editor-storage-panel">
        <strong>草稿工具</strong>
        <p id="draft-status">尚未儲存</p>
        <button class="editor-button ghost full" id="restore-published-button" type="button">載入目前已發布內容</button>
        <button class="editor-button danger full" id="clear-draft-button" type="button">清空所有草稿</button>
      </section>
    </aside>

    <section class="editor-workspace" aria-live="polite">
      <div id="editor-form"></div>
    </section>

    <aside class="editor-summary" aria-label="即時摘要">
      <div class="summary-header">
        <div>
          <small>LIVE SUMMARY</small>
          <strong>即時摘要</strong>
        </div>
        <a href="index.html#/" target="_blank" rel="noopener">公開頁面 ↗</a>
      </div>
      <div id="editor-preview"></div>
      <div class="summary-note">
        <strong>公開網站仍是唯讀</strong>
        <p>這裡的修改只保存在目前瀏覽器。下載並更新 GitHub 的 <code>data.js</code> 後，其他人才會看到新內容。</p>
      </div>
    </aside>
  </main>

  <input id="import-file-input" type="file" accept=".js,.json,application/json,text/javascript" hidden>
  <div class="editor-toast" id="editor-toast" role="status" aria-live="polite"></div>
</body>
</html>
